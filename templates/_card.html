<article class="product-card"><a class="pic" href="{{ url_for('product',product_id=p.id) }}">{% if p.discount %}<em>-{{ p.discount }}%</em>{% endif %}<img src="{{ p.image }}" alt="{{ p.name }}"></a><div class="stars"><i class="fa-solid fa-star"></i> {{ p.rating }} <span>({{ p.reviews }})</span></div><a class="pname" href="{{ url_for('product',product_id=p.id) }}">{{ p.name }}</a><div class="price">₹{{ '{:,.0f}'.format(p.price) }} {% if p.old_price %}<del>₹{{ '{:,.0f}'.format(p.old_price) }}</del>{% endif %}</div><button class="btn add-btn" data-id="{{ p.id }}">Add to Cart</button></article>
